---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-disk
# Cost: pd-balanced instead of pd-ssd. Bedrock is not IOPS-hungry, and
# pd-balanced is roughly half the price per GiB.
# The in-tree kubernetes.io/gce-pd provisioner was removed in Kubernetes 1.26,
# so the CSI driver is required on current GKE.
provisioner: pd.csi.storage.gke.io
allowVolumeExpansion: true
# Keep the disk when the PVC is deleted so a world survives a teardown.
reclaimPolicy: Retain
# Autopilot: don't provision the disk until a Pod actually needs it. Matters
# when scaling to zero.
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: pd-balanced
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: mc-bedrock
spec:
  storageClassName: fast-disk
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 5Gi on pd-balanced costs well under $1/month and leaves room for the
      # world to grow. 1Gi fills up fast once chunks are generated.
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-bedrock
  labels:
    app: mc-bedrock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-bedrock
  template:
    metadata:
      name: mc-bedrock
      labels:
        app: mc-bedrock
    spec:
      # Cost: Spot Pods run at up to ~60% off standard Autopilot rates.
      # Trade-off: GKE can evict this Pod at any time to reclaim capacity, and
      # the preemption grace period is capped at 15 seconds regardless of what
      # terminationGracePeriodSeconds says. The world is on a PVC, so an
      # eviction means a server restart, not data loss. Spot Pods are excluded
      # from the Autopilot SLA.
      # Remove this nodeSelector to go back to standard (SLA-covered) Pods.
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc-bedrock
          image: itzg/minecraft-bedrock-server:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          # Autopilot bills per Pod request, and on a non-bursting cluster it
          # raises requests to match limits. Requests and limits are therefore
          # set equal and deliberately: mismatched values here just mean paying
          # for the larger number. 500m CPU with 2Gi sits inside the
          # general-purpose 1:1-1:6.5 vCPU:GiB ratio, so GKE won't adjust it.
          # A small Bedrock server runs comfortably in 2Gi.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 500m
              memory: 2Gi
          env:
            - name: EULA
              value: "TRUE"
            - name: GAMEMODE
              value: survival
            - name: DIFFICULTY
              value: normal
            - name: WHITE_LIST
              value: "false"
            - name: ONLINE_MODE
              value: "true"
            - name: ALLOW_CHEATS
              value: "false"
          volumeMounts:
            - mountPath: /data
              name: data
          # Health checks for automatic restart on failure
          livenessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - localhost
                - --port
                - "19132"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness check to ensure server is ready before receiving traffic
          readinessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - localhost
                - --port
                - "19132"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mc-bedrock
---
apiVersion: v1
kind: Service
metadata:
  name: mc-bedrock
  labels:
    app: mc-bedrock
spec:
  selector:
    app: mc-bedrock
  ports:
    - name: bedrock
      port: 19132
      targetPort: 19132
      protocol: UDP
  type: LoadBalancer
  # Security: Restrict access to specific IP addresses
  # Replace with your actual IPs (format: "X.X.X.X/32")
  loadBalancerSourceRanges:
    - "YOUR_HOME_IP/32"        # Your home/office IP
    # - "FRIEND_IP_1/32"       # Add additional IPs as needed
    # - "FRIEND_IP_2/32"
